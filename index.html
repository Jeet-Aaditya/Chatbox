<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sasta ChatGPT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-shell">
      <header class="chat-header">
        <div class="brand">
          <div class="app-logo">AI</div>
          <div class="title-group">
            <h2>Sasta ChatGPT</h2>
            <span class="status"><span class="status-dot"></span>Online</span>
          </div>
        </div>
        <button class="menu-button" aria-label="More options">⋯</button>
      </header>

      <main class="chat-messages" aria-label="Chat messages">
        <div class="message ai">
          <span class="label">Assistant</span>
          Hello! I can help with ideas, writing, and quick answers.
        </div>

        <div class="message user">
          <span class="label">You</span>
          Build me a clean chatbox design.
        </div>

        <div class="message ai">
          <span class="label">Assistant</span>
          Sure — here is a modern interface with soft gradients and a polished layout.
        </div>
      </main>

      <footer class="composer">
        <div class="input-wrap">
          <input class= "Inputbox" type="text" placeholder="Type a message..." aria-label="Type a message" />
        </div>
        <button class="send-button" aria-label="Send message">➤</button>
      </footer>
    </div>
  </body>
</html>
